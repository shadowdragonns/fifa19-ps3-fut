name: Tests and public-file audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python audit_public.py
      - run: python initialize_tls.py
      - run: python server.py --check
      - run: python build_bundle.py --output dist/ci
      - run: python audit_public.py --bundle dist/ci/fifa19-fut-server.zip --bundle dist/ci/fifa19-fut-client.zip

  launcher-gui:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - if: runner.os == 'Linux'
        run: xvfb-run -a python tests/gui_smoke.py
      - if: runner.os == 'Windows'
        run: python tests/gui_smoke.py
